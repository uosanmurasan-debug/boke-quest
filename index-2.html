<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぼけますたーくえすと</title><style>body{margin:0;background:#fff7dc;font-family:system-ui,sans-serif;color:#332b26}main{max-width:650px;margin:auto;padding:16px}h1{text-align:center;font-size:27px}.panel{background:white;border:3px solid #f4c44d;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 0 #e5c55d}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold}.question{background:#fff1bd;padding:22px;border-radius:15px;font-size:23px;font-weight:bold;text-align:center}textarea{box-sizing:border-box;width:100%;font:inherit;font-size:19px;padding:12px;border:2px solid #e6b74e;border-radius:12px;min-height:110px}button{font:inherit;font-weight:bold;border:0;border-radius:12px;background:#ffbc30;padding:13px 17px;cursor:pointer;margin:5px 3px}button:disabled{opacity:.45}button.secondary{background:#e9e9e9}button.green{background:#80df9a}.hidden{display:none}.score{font-size:40px;text-align:center;color:#d47700}.small{font-size:13px;color:#756b61}.record{border-top:2px dashed #e7ca85;padding:13px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:8px 0}#message{font-weight:bold;color:#a04e00}button:focus-visible{outline:3px solid #2779cc}</style></head><body><main><h1>🤣 ぼけますたーくえすと 🪙</h1><section class="panel"><div class="stats"><span id="coins"></span><span id="level"></span><span id="stage"></span></div><p id="message"></p></section><section id="start" class="panel"><h2>🎤 ぼけのぼうけん！</h2><p>おだいにぼけて、こいんをあつめよう！ 10もんでさいてんかい！</p><button onclick="startGame()">▶️ げーむすたーと！</button><button class="secondary" onclick="openShop()">🛒 こいんしょっぷ</button></section><section id="play" class="panel hidden"><p id="counter"></p><div id="question" class="question"></div><div id="entry"><p>きみのぼけをかいてね！</p><textarea id="answer" placeholder="ここにぼけをかいてね！"></textarea><p><button onclick="submitBoke()">🤣 さいてんする！</button><button class="secondary" onclick="nextQuestion()">🎲 おだいをかえる</button></p></div><div id="result" class="hidden"><div class="score" id="score"></div><h3 id="reward"></h3><p id="comment"></p><p id="tip"></p><button onclick="advance()">⚔️ つぎへ！</button></div><button class="secondary" onclick="openShop()">🛒 こいんしょっぷ</button></section><section id="final" class="panel hidden"><h2>🏆 ぼけますたーさいてんかい！</h2><div id="summary"></div><div id="records"></div><button onclick="startGame()">🔄 もういっかい！</button><button class="secondary" onclick="openShop()">🛒 こいんしょっぷ</button></section><section id="shop" class="panel hidden"><h2>🛒 こいんしょっぷ</h2><p>🪙 もっているこいん：<b id="shopCoins"></b></p><div id="shopItems"></div><button class="secondary" onclick="closeShop()">もどる</button></section><p class="small">※ さいてんとこめんとは、ことばのとくちょうをつかったかんいばんです。ぼけのいみをほんとうにりかいするえーあいさいてんではありません。</p></main><script>
const people=['ぺんぎん','まりお','くっぱ','ぞんび','さかな','ねこ','ごりら','おばけ','ろぼっと','こうちょうせんせい','うちゅうじん','あかちゃん','ゆうしゃ','どらごん','かえる','さめ','にわとり','おうさま','てんさいはかせ','こんびにのてんいん'];
const scenes=['ががっこうにちこく！なぜ？','がへんなものをはつめい！なに？','がとつぜんおどりだした！なぜ？','が100おくえんをげっと！なににつかった？','がぼすになった！どんなこうげき？','がたいほされた！なぜ？','がたからばこをあけた！なかみは？','がてれびにでた！なんていった？','がせかいいちになった！なんのせかいいち？','がまほうをつかった！なにがおきた？','がおみせをひらいた！なにをうる？','がひみつをばらした！どんなひみつ？','がぼたんをおした！どうなった？','がうちゅうにいった！なにをした？','がぷれぜんとをあげた！なにをあげた？'];
const catalog=[{id:'double',name:'✨ こいん2ばい',price:80,desc:'つぎのさいてんでこいんが2ばい'},{id:'triple',name:'🔥 こいん3ばい',price:150,desc:'つぎのさいてんでこいんが3ばい'},{id:'crown',name:'👑 おうかん',price:200,desc:'ずっともっていられる'},{id:'penguin',name:'🐧 ぺんぎんすきん',price:100,desc:'ずっともっていられる'},{id:'sparkle',name:'💎 きらきらぼけますたー',price:500,desc:'ずっともっていられる'},{id:'gacha',name:'🎲 おだいがちゃ',price:50,desc:'あたらしいおだいにかえる'}];
const load=()=>{try{return JSON.parse(localStorage.getItem('boke_master_save_v1'))||{coins:0,owned:[],boost:1}}catch{return {coins:0,owned:[],boost:1}}};let save=load();if(!Number.isFinite(save.coins))save.coins=0;if(!Array.isArray(save.owned))save.owned=[];if(![1,2,3].includes(save.boost))save.boost=1;
let game={round:0,history:[],used:[],question:''},lastScreen='start';const el=id=>document.getElementById(id);const persist=()=>localStorage.setItem('boke_master_save_v1',JSON.stringify(save));function stats(){el('coins').textContent='🪙 '+save.coins+' こいん';el('level').textContent='⭐ れべる '+(1+Math.floor(game.history.reduce((s,r)=>s+r.points,0)/250));el('stage').textContent='⚔️ '+Math.min(game.round+1,10)+'/10'}function show(id){['start','play','final','shop'].forEach(x=>el(x).classList.toggle('hidden',x!==id));stats()}function message(s){el('message').textContent=s}function pick(){let id;do{id=Math.floor(Math.random()*people.length*scenes.length)}while(game.used.includes(id)&&game.used.length<people.length*scenes.length);game.used.push(id);game.question=people[id%people.length]+scenes[Math.floor(id/people.length)];el('question').textContent=game.question;el('answer').value='';el('entry').classList.remove('hidden');el('result').classList.add('hidden');el('counter').textContent='だい '+(game.round+1)+' もん / 10';stats()}
function startGame(){game={round:0,history:[],used:[],question:''};pick();show('play');message('ぼけて、こいんをげっと！')}
function nextQuestion(){pick();message('あたらしいおだいになったで！')}
function judge(answer){const s=answer.trim(),unique=new Set([...s]).size,twist=/じつは|なのに|まさか|ぎゃく|とつぜん|しかも|ぜんぶ|だけ|ばくはつ|うんち|ばなな|ぺんぎん|せかい|さいきょう|なんでやねん|！/.test(s);const points=Math.min(100,Math.max(20,Math.round(28+Math.min(s.length,45)*.75+Math.min(unique,25)*.85+(twist?16:0)+(s.includes('！')?5:0))));let good='じぶんなりのはっそうで、おだいにこたえているところがいいね！',tip='もっとびっくりすることをくわえると、おもしろくなりそう！';if(/さかな|ぺんぎん|ねこ|ごりら|ばなな|うんち/.test(s)){good='どうぶつやへんなものをとうじょうさせる、ゆかいなはっそうがおもしろい！';tip='そのあとにおこる、へんなできごともつけたすといいかも！'}else if(/じつは|なのに|まさか|ぎゃく/.test(s)){good='よそうとちがうてんかいをつくっているところがおもしろい！';tip='さいごにもうひとつびっくりすることをいれてみよう！'}else if(s.length<=9){good='みじかいことばで、いっきにぼけているところがいいね！';tip='もうすこしだけくわしくすると、つたわりやすいかも！'}else if(/！|!/.test(s)){good='いきおいのあるいいかたで、ぼけをもりあげているところがいいね！';tip='いがいなりゆうをつけたすと、さらにおもしろくなるかも！'}else if(s.length>=25){good='じょうきょうをくわしくかんがえて、ものがたりのようにぼけているところがいいね！';tip='いちばんおもしろいところをみじかくいうのもためしてみよう！'}return {points,good,tip}}
function submitBoke(){const answer=el('answer').value.trim();if(!answer){message('ぼけをかいてね！');return}const j=judge(answer),base=j.points>=90?100:j.points>=80?70:j.points>=60?40:j.points>=40?20:10,earned=base*save.boost;save.coins+=earned;save.boost=1;persist();game.history.push({question:game.question,answer,...j,earned});el('score').textContent=j.points+'てん！';el('reward').textContent='🪙 +'+earned+' こいん！';el('comment').textContent='💬 どこがおもしろかった？ '+j.good;el('tip').textContent='💡 もっとおもしろくするこつ：'+j.tip;el('entry').classList.add('hidden');el('result').classList.remove('hidden');el('result').querySelector('button').textContent=game.round===9?'🏆 さいてんかいへ！':'⚔️ つぎのくえすとへ！';stats();message('こいんげっと！')}
function advance(){if(game.round===9){finish();return}game.round++;pick()}
function finish(){const total=game.history.reduce((s,r)=>s+r.points,0);el('summary').textContent='⭐ ごうけい '+total+' てん！　🪙 いま '+save.coins+' こいん！';el('records').replaceChildren();game.history.forEach((r,i)=>{const box=document.createElement('div');box.className='record';[['h3','だい '+(i+1)+' もん　'+r.points+'てん　🪙+'+r.earned],['p','🎤 '+r.question],['p','🤣 '+r.answer],['p','💬 どこがおもしろかった？ '+r.good],['p','💡 もっとおもしろくするこつ：'+r.tip]].forEach(([tag,t])=>{const e=document.createElement(tag);e.textContent=t;box.append(e)});el('records').append(box)});show('final');message('おつかれさま！')}
function openShop(){lastScreen=['play','final','start'].find(x=>!el(x).classList.contains('hidden'))||'start';renderShop();show('shop')}function closeShop(){show(lastScreen)}function renderShop(){el('shopCoins').textContent=save.coins;el('shopItems').replaceChildren();catalog.forEach(item=>{const owned=save.owned.includes(item.id),active=(item.id==='double'&&save.boost===2)||(item.id==='triple'&&save.boost===3),row=document.createElement('div');row.className='item';const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=item.name;const p=document.createElement('p');p.className='small';p.textContent=item.desc;info.append(strong,p);const btn=document.createElement('button');btn.textContent=owned?'もってる':active?'せっていずみ':'🪙 '+item.price;btn.disabled=owned||active||save.coins<item.price;btn.onclick=()=>buy(item);row.append(info,btn);el('shopItems').append(row)})}
function buy(item){if(save.coins<item.price)return;if(['crown','penguin','sparkle'].includes(item.id)&&save.owned.includes(item.id))return;if(['double','triple'].includes(item.id)&&save.boost!==1){message('こいんばいぞうは、いちどにつきひとつだけ！');return}if(item.id==='gacha'&&lastScreen!=='play'){message('おだいがちゃは、くえすとのとちゅうでつかってね！');return}save.coins-=item.price;if(['crown','penguin','sparkle'].includes(item.id))save.owned.push(item.id);if(item.id==='double')save.boost=2;if(item.id==='triple')save.boost=3;if(item.id==='gacha'){if(el('result').classList.contains('hidden'))pick();else message('つぎのおだいをかえたいときにつかってね！')}persist();renderShop();stats();message(item.name+' をげっと！')}
stats();show('start');
</script></body></html>
